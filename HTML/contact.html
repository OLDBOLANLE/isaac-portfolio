    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar edge">
        <img
          class="logo"
          src="/assets/img/logo.jpg"
          width="70"
          height="70"
          alt="Logo"
        />

    <h2 class="contact-me">Contact Me</h2>
    <p class="font">
      if you would like to get in touch with me, please free to reach out to me
      via email at <a href="mailto:udahisaac25@gmail.com">ISAACLARGE@</a>
    </p>

    <p class="font">
      you can also visit my
      <a href="https://www.youtube.com" target="_blank">YOUTUBE</a> channel to
      see my latest videos and updates.
    </p>

    <section>
      <form method="post" action="">
        <div>
          <label for="name">Name:</label>
          <input type="text" name="fullname" required />
        </div>
        <div>
          <label for="email">Email:</label>
          <input type="email" name="email" required />
        </div>

        <div>
          <label for="phone">Phone:</label>
          <input type="number" name="phone" min="10" max="13" required />
        </div>

        <div>
          <label for="message">Message:</label>
          <textarea name="message" required></textarea>
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>
